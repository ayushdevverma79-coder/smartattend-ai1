name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Capacitor Android Project
        run: |
          mkdir -p www
          echo "<h1>Loading...</h1>" > www/index.html
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "AttendanceApp" "com.attendance.app" --web-dir=www
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.attendance.app",
            "appName": "AttendanceApp",
            "webDir": "www",
            "server": {
              "url": "https://vercel.app",
              "cleartext": true
            }
          }
          EOF
          
          npx cap add android

      - name: Compile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: attendance-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
